server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: employee-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/employees/**
        - id: department-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/departments/**
        - id: designation-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/designations/**
        - id: payroll-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/payroll/**
        - id: resignation-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/resignations/**
