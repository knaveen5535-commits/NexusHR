server:
  port: ${PORT:9000}
  address: 0.0.0.0

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: employee-service
          uri: ${EMPLOYEE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/employees/**, /api/employees, /api/notifications/**, /api/notifications
        - id: department-service
          uri: ${EMPLOYEE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/departments/**, /api/departments
        - id: designation-service
          uri: ${EMPLOYEE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/designations/**, /api/designations
        - id: payroll-service
          uri: ${PAYROLL_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/payroll/**, /api/payroll, /api/payrolls/**, /api/payrolls, /api/attendance/**, /api/attendance, /api/salary-structures/**, /api/salary-structures
        - id: resignation-service
          uri: ${EMPLOYEE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/resignations/**, /api/resignations
        - id: feedback-service
          uri: ${EMPLOYEE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/feedback/**, /api/feedback
